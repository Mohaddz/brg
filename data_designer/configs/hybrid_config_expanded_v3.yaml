sources: ../output/expanded_v3/verified_sources.json
seed_user_mode: literal_question
repair_style_once: true
prefer_shape_compliant: true
models:
  writer: openai/gpt-6-luna
  enhancer: openai/gpt-6-luna
  judge: openai/gpt-6-luna
runtime:
  host: root@135.181.63.163
  repo: /root/brg
  output: data_designer/output/saudi_expanded_v3.jsonl
  max_parallel_requests: 10
  batch_size: 20
  max_exchanges: 2
  max_tokens: 4096
  budget_usd: 3
  reserve_per_request_usd: 0.005
  timeout_seconds: 180
user_styles:
- Short ordinary Saudi wording; ask the actual question without a backstory
openings:
  direct: 1
exchange_distribution:
  1: 75
  2: 25
optional_closing_rate: 0.15
cite_grounded_answers: true
answer_styles:
- Lead with the answer, then connected short paragraphs. Avoid a closing recap that
  repeats the opening.
- Explain through one concrete example, then relate it to the question. Use worked
  steps for calculations.
- Give the answer and the reasons in a small explained list where useful. Do not force
  generic headings.
- Use a concise comparison when there are two alternatives; otherwise use natural
  prose. Tables only for real comparisons.
- Start with the result, explain how to understand it, then add one useful detail
  or check. No automatic summary.
diversity:
  scale_gate_count: 200
  max_questions_per_topic: 2
  min_unique_topic_fraction: 0.5
  answer_ngram_similarity: 0.72
question_guidance: Use short everyday Saudi wording. Follow-ups normally 3-12 words,
  at most 18; one real question only. No polished specifications, invented biography,
  requests to make every answer shorter, or greetings. Stop when the question is answered.
  Stay inside the source scope.
response_guidance: 'Use natural Saudi Arabic and useful Markdown. Match depth to the
  actual request: narrow facts and one-step calculations may be brief; how/why answers
  need relevant explanation; homework needs worked reasoning; teaching needs an example
  and activity. These ranges are targets, never filler quotas. Cite the actual supporting
  page near each claim. Follow the assigned optional closing policy; end other answers
  naturally. Avoid repeated recaps and unprompted evidence-availability disclaimers.'
quality_policy:
  max_user_words: 24
  min_answer_words: 90
  min_followup_answer_words: 35
  max_answer_words: 1000
  require_markdown: true
depths:
  developed: 'Usually 80-180 words: direct answer with relevant reasons, context or
    a worked example. Preserve useful depth.'
  compact: 'Usually 20-90 words: answer the date, place, name, color or score completely.
    Add context only when useful; never pad.'
  instructional: 'Usually 110-220 words: parent wording, concrete activity and a check
    of understanding.'
  casual: Usually 5-60 words; warm natural conversation, without forced formatting
    or lecture structure.
