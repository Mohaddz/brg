version: saudi-natural-v2
seed: 10012026
count: 50
references: ../references/hybrid_references_v2.json
sources: ../references/hybrid_sources_v2.json
seed_user_mode: literal_question
repair_style_once: true
prefer_shape_compliant: true
models:
  writer: openai/gpt-6-luna
  enhancer: openai/gpt-6-luna
  judge: openai/gpt-6-luna
runtime:
  host: root@135.181.63.163
  repo: /root/brg
  output: data_designer/output/saudi_natural_v2_50_refined.jsonl
  max_parallel_requests: 4
  batch_size: 10
  max_exchanges: 2
  max_tokens: 4096
  budget_usd: 2.0
  reserve_per_request_usd: 0.005
  timeout_seconds: 180
user_styles:
- Short ordinary Saudi wording; ask the actual question without a backstory
openings:
  direct: 1
exchange_distribution:
  1: 55
  2: 45
optional_closing_rate: 0.15
cite_grounded_answers: true
answer_styles:
- Lead with the answer, then connected short paragraphs. Avoid a closing recap that
  repeats the opening.
- Explain through one concrete example, then relate it to the question. Use worked
  steps for calculations.
- Give the answer and the reasons in a small explained list where useful. Do not force
  generic headings.
- Use a concise comparison when there are two alternatives; otherwise use natural
  prose. Tables only for real comparisons.
- Start with the result, explain how to understand it, then add one useful detail
  or check. No automatic summary.
diversity:
  scale_gate_count: 200
  max_questions_per_topic: 3
  min_unique_topic_fraction: 0.4
  answer_ngram_similarity: 0.72
question_guidance: Use short everyday Saudi wording. Follow-ups normally 3-12 words,
  at most 18; one real question only. No polished specifications, invented biography,
  requests to make every answer shorter, or greetings. Stop when the question is answered.
  Stay inside the source scope.
response_guidance: 'Use natural Saudi Arabic with useful Markdown. Developed answers
  usually 100-220 Arabic whitespace words; instructional answers 130-240; compact
  date/place questions 45-100. These are shape targets, not filler quotas. Lead with
  the answer, then relevant explanation or a worked example. Vary the structure: paragraphs,
  explained steps, a comparison, or an example as appropriate. Do not repeatedly end
  with a recap. Most follow-ups 50-150 words. Follow the per-chat closing policy for
  optional next-step offers. Do not mention internal evidence packs or the synthetic
  recipe to the user.'
quality_policy:
  max_user_words: 24
  min_answer_words: 90
  min_followup_answer_words: 35
  max_answer_words: 300
  require_markdown: true
depths:
  developed: '100-220 words: direct answer plus meaningful context/reasoning, using
    readable Markdown.'
  compact: '45-100 words: answer the date/place/count directly, add just enough context
    to avoid ambiguity; no essay.'
  instructional: '130-240 words: teach through an example, explained steps and a quick
    check; no repetitive padding.'
